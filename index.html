<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Học Tiếng Trung</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;800;900&family=Noto+Sans+SC:wght@700;900&display=swap" rel="stylesheet">
<style>
  /* Game Show Flat palette — see DESIGN.md */
  :root {
    --ink: #1C1530; --cream: #FFF4DF; --white: #FFFFFF;
    --red: #FF5A5F; --yellow: #FFD23F; --green: #3DDC84; --pink: #FF7EB6;
    --set: #6C4FC4; --stripe: #7A5FD0;
    --display: "Baloo 2", "Nunito", -apple-system, system-ui, sans-serif;
    --body: "Nunito", -apple-system, "SF Pro Text", system-ui, sans-serif;
    --han: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --pop: cubic-bezier(.34, 1.56, .64, 1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; overflow-x: hidden; }
  body {
    min-height: 100vh; color: var(--ink); font-family: var(--body); background: var(--set);
    padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  .set {
    position: fixed; inset: -60px; z-index: -1; background-color: var(--set);
    background-image: repeating-linear-gradient(-45deg, var(--stripe) 0 22px, transparent 22px 44px);
    animation: scroll 6s linear infinite;
  }
  @keyframes scroll { to { transform: translate(62.2px, 0); } }
  main { max-width: 520px; margin: 0 auto; }
  .card {
    position: relative; background: var(--cream); border: 4px solid var(--ink); border-radius: 28px;
    box-shadow: 8px 8px 0 var(--ink); padding: 34px 18px 22px; margin-top: 18px; min-height: 200px;
  }
  .banner {
    position: absolute; top: -18px; left: 14px; transform: rotate(-4deg);
    font: 800 17px/1 var(--display); padding: 9px 14px 6px; border: 3px solid var(--ink);
    border-radius: 12px; box-shadow: 3px 3px 0 var(--ink); background: var(--yellow); white-space: nowrap;
  }
  .hanzi { font-family: var(--han); font-weight: 900; text-align: center; line-height: 1.15; margin: 6px 0 4px; }
  .pinyin { text-align: center; font: 900 30px/1.2 var(--body); color: var(--red); }
  .nghia {
    display: table; margin: 10px auto 0; font: 800 24px/1.2 var(--display); text-align: center;
    background: var(--yellow); padding: 8px 16px 4px; border: 3px solid var(--ink); border-radius: 14px;
    box-shadow: 3px 3px 0 var(--ink); transform: rotate(-1.5deg);
  }
  .meta { text-align: center; font-size: 15px; margin-top: 12px; line-height: 1.5; }
  .meta span { opacity: .65; }
  .speak { display: flex; gap: 10px; justify-content: center; margin: 16px 0 4px; flex-wrap: wrap; }
  button {
    font: 800 15px/1 var(--body); color: var(--ink); background: var(--white); cursor: pointer;
    border: 3px solid var(--ink); border-radius: 99px; padding: 11px 16px; min-height: 44px;
    box-shadow: 3px 3px 0 var(--ink); transition: transform .08s, box-shadow .08s;
  }
  button:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
  h2 { font: 800 14px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; margin: 22px 0 8px;
    display: inline-block; background: var(--ink); color: var(--cream); padding: 6px 10px 3px; border-radius: 8px; }
  .ex-zh { font: 700 22px/1.4 var(--han); }
  .ex-py { color: var(--red); font-weight: 800; font-size: 15px; margin-top: 2px; }
  .ex-vi { font-style: italic; margin-top: 2px; opacity: .75; }
  .meo { font-size: 16px; line-height: 1.55; background: var(--white); border: 3px solid var(--ink); border-radius: 16px; padding: 12px 14px; }
  nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 22px; }
  nav button { min-height: 52px; padding: 12px 18px; font-size: 17px; background: var(--yellow); border-width: 4px; box-shadow: 5px 5px 0 var(--ink); }
  #pos { font: 800 16px/1 var(--display); background: var(--ink); color: var(--white); padding: 9px 12px 6px; border-radius: 99px; }
  .note { color: var(--white); font-weight: 800; font-size: 13px; text-align: center; margin-top: 20px; text-shadow: 1.5px 1.5px 0 var(--ink); }
  .loading { text-align: center; font: 800 20px/1 var(--display); padding-top: 60px; }
  .pop { animation: pop .4s var(--pop); }
  @keyframes pop { from { transform: scale(.85) rotate(-2deg); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="set" aria-hidden="true"></div>
<main>
  <div class="card" id="card"><div class="loading">Đang tải… 🃏</div></div>
  <nav>
    <button id="prev">← Trước</button>
    <span id="pos"></span>
    <button id="next">Sau →</button>
  </nav>
  <p class="note">“đọc” chỉ là cách đọc gần đúng theo kiểu Việt — bấm 🔊 để nghe chuẩn.</p>
</main>
<script>
const HOURS_PER_WORD = 3; // keep in sync with widget.js
const SETS = [["#6C4FC4", "#7A5FD0"], ["#FF9F43", "#FFB063"], ["#3FB7EA", "#5CC4EF"], ["#FF77AE", "#FF8DBC"], ["#22B39F", "#3BC2AE"], ["#8BD346", "#9CDB60"]];
let words = [], i = 0;

function speak(text, rate) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-CN";
  u.rate = rate;
  const v = speechSynthesis.getVoices().find(v => v.lang.replace("_", "-").startsWith("zh-CN"));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function hanziSize(h) {
  const n = [...String(h || "")].length;
  return n <= 1 ? 120 : n === 2 ? 100 : n === 3 ? 80 : 62;
}

function render() {
  const w = words[i];
  const [bg, stripe] = SETS[i % SETS.length];
  document.documentElement.style.setProperty("--set", bg);
  document.documentElement.style.setProperty("--stripe", stripe);
  const card = document.getElementById("card");
  card.innerHTML = `
    <div class="banner">Từ #${esc(w.id)}${w.level != null ? ` · HSK ${esc(w.level)}` : ""}</div>
    <div class="hanzi" style="font-size:${hanziSize(w.hanzi)}px">${esc(w.hanzi)}</div>
    <div class="pinyin">${esc(w.pinyin)}</div>
    <div><div class="nghia">${esc(w.nghia)}</div></div>
    <div class="meta">đọc gần giống: <b>${esc(w.doc)}</b><br><span>Hán Việt:</span> <b>${esc(w.hanviet)}</b></div>
    <div class="speak">
      <button data-say="word">🔊 Nghe</button>
      <button data-say="slow">🐢 Chậm</button>
    </div>
    <h2>Ví dụ</h2>
    <div class="ex-zh">${esc(w.vd.zh)}</div>
    <div class="ex-py">${esc(w.vd.py)}</div>
    <div class="ex-vi">${esc(w.vd.vi)}</div>
    <div class="speak" style="justify-content:flex-start"><button data-say="ex">🔊 Nghe câu ví dụ</button></div>
    <h2>Mẹo nhớ</h2>
    <div class="meo">💡 ${esc(w.meo)}</div>`;
  card.classList.remove("pop");
  void card.offsetWidth;
  card.classList.add("pop");
  document.getElementById("pos").textContent = `${i + 1} / ${words.length}`;
  history.replaceState(null, "", "?id=" + w.id);
}

document.getElementById("card").addEventListener("click", e => {
  const b = e.target.closest("button[data-say]");
  if (!b) return;
  const w = words[i];
  if (b.dataset.say === "word") speak(w.hanzi, 0.8);
  if (b.dataset.say === "slow") speak(w.hanzi, 0.45);
  if (b.dataset.say === "ex") speak(w.vd.zh, 0.8);
});
document.getElementById("prev").onclick = () => { i = (i - 1 + words.length) % words.length; render(); };
document.getElementById("next").onclick = () => { i = (i + 1) % words.length; render(); };
speechSynthesis.getVoices(); // warm up voice list (iOS loads it lazily)

fetch("words.json").then(r => r.json()).then(data => {
  words = data;
  const id = Number(new URLSearchParams(location.search).get("id"));
  const byId = words.findIndex(w => w.id === id);
  if (byId >= 0) {
    i = byId;
  } else {
    // Same rotation as the widget, so opening the site shows the current word.
    const slotMs = HOURS_PER_WORD * 3600 * 1000;
    const tzMs = new Date().getTimezoneOffset() * 60000;
    i = Math.floor((Date.now() - tzMs) / slotMs) % words.length;
  }
  render();
});
</script>
</body>
</html>
